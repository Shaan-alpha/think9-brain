# Render Blueprint for the Think9 Brain backend.
#
# Not Vercel: the embedding and cross-encoder weights load once at startup and stay in
# memory. A serverless function would pay that cost on every cold start, and the ONNX
# runtime pushes the bundle past comfortable limits.
services:
  - type: web
    name: think9-brain-api
    runtime: python
    # The running service is on the free plan, which sleeps after 15 minutes idle and
    # draws on 750 instance hours shared across every free service in the workspace.
    #
    # This file does not drive that service: it was created through the Render API, so a
    # blueprint sync is not what deploys it. Changing anything here without a matching
    # `PATCH /v1/services/{id}` changes nothing but this file, which has already cost one
    # wasted deploy cycle. It is kept accurate so it does not mislead.
    plan: free
    # Singapore is close to the users and far from the database, which is in Neon's
    # us-east-2. Every query in a request crosses the Pacific; moving the Neon project to
    # an Asian region is the remaining latency win, and means migrating the data.
    region: singapore
    rootDir: backend
    # The build downloads the ONNX weights into the image. Fetching them at request time
    # costs memory on top of an already-resident model, and on a 512 MB instance that
    # combination is what killed the first deploy mid-question.
    buildCommand: pip install uv && uv sync --frozen && uv run python -m think9.warm_models
    # One worker deliberately: each would load its own copy of both models (~300 MB).
    startCommand: uv run uvicorn think9.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    # /health, not /ready, and deliberately so. Render probes this every few seconds; a
    # path that queries Postgres would hold Neon's compute awake permanently and burn the
    # free plan's monthly compute hours in about a week. It would also let one database
    # blip restart a container that was serving fine. /ready exists for the hourly check
    # in .github/workflows/readiness.yml, which is where that question belongs.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Inside the build's working directory, so the weights the build downloads are the
      # ones the running process finds. A temp directory would not survive.
      - key: FASTEMBED_CACHE_DIR
        value: /opt/render/project/src/backend/.fastembed_cache
      # Set these in the Render dashboard; none of them belong in this file.
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: ROUTER_MODEL
        value: llama-3.1-8b-instant
      # Fitted on the dev question set. See evalkit/scorecard_dev.md.
      - key: COVERAGE_TAU
        value: "0.55"
      # Leave GOOGLE_CREDENTIALS_JSON unset to ingest from the local corpus mirror.
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
      # The deployed frontend origin, so the browser can call this service.
      - key: CORS_ORIGINS
        sync: false
