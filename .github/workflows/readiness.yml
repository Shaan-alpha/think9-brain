name: Check the API can actually answer

# `keepalive.yml` pings /health, which touches nothing and therefore cannot tell "the
# process is up" apart from "the process is up and every question returns 500". That gap
# hid a real outage for hours: the API held one database connection, Neon dropped it after
# a few idle minutes, and /health stayed green the whole time.
#
# /ready takes a connection from the pool and runs a query, so it fails when answers fail.
#
# Hourly, and inside the keepalive's window rather than around the clock. Two budgets make
# that the right shape:
#
# - Render's free instance hours are shared by four services in this workspace. Checking
#   while the keepalive already holds this one awake costs no extra instance time; checking
#   at 3am would wake it for fifteen minutes to learn nothing.
# - Each check also wakes Neon's compute, which then stays up about five minutes. Twelve a
#   day is roughly an hour of compute against the free plan's 191.9 a month. Running this
#   as often as the keepalive would hold the database awake permanently and spend that
#   budget in a fortnight.
on:
  schedule:
    - cron: "17 4-15 * * *"
  workflow_dispatch:

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Ask whether the API is ready, not merely alive
        run: |
          # --max-time 180 because a check arriving after a spin-down pays the wake cost.
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' --max-time 180 \
            https://think9-brain-api.onrender.com/ready)
          echo "ready returned $code"
          cat /tmp/ready.json || true
          # A warning, not a failure: one bad check is more likely a cold start than an
          # outage, and a red badge on every wake teaches people to ignore the badge.
          # Two consecutive warnings is the signal worth acting on.
          test "$code" = "200" || echo "::warning::/ready returned $code — the service is \
            up but cannot reach its database, which means every question is failing"
